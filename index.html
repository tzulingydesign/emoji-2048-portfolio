<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,sans-serif;color:#222;background:#f6f6f3;background-image:linear-gradient(#e9e9e5 1px,transparent 1px),linear-gradient(90deg,#e9e9e5 1px,transparent 1px);background-size:24px 24px;overflow:hidden}
.mono{font-family:'JetBrains Mono',monospace;font-size:13px;color:#666;letter-spacing:.5px}
nav{display:flex;justify-content:space-between;padding:20px 32px}nav span{margin-left:24px}
.hero{position:relative;height:calc(100% - 160px);display:flex;align-items:center;justify-content:center}
.left,.right{position:absolute;top:50%;transform:translateY(-50%)}
.left{left:5%}.right{right:5%}
.big{font-size:76px;font-weight:300;margin:6px 0}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-size:96px;margin:0}
.console{width:330px;padding:22px;border-radius:44px;background:linear-gradient(145deg,#ffd43b,#f5b700);box-shadow:inset 0 -6px 12px rgba(0,0,0,.15),inset 0 4px 8px rgba(255,255,255,.6),0 30px 50px rgba(0,0,0,.18);transform:translate(var(--x,0px),var(--y,0px)) rotate(-3deg) scale(.7);cursor:grab;touch-action:none;user-select:none;position:relative;z-index:5}
.console.drag{cursor:grabbing;transform:translate(var(--x,0px),var(--y,0px)) rotate(0deg) scale(.73);box-shadow:inset 0 -6px 12px rgba(0,0,0,.15),inset 0 4px 8px rgba(255,255,255,.6),0 45px 70px rgba(0,0,0,.25)}
.console{transition:transform .15s,box-shadow .15s}
.screen{background:#2b2b2b;border-radius:24px;padding:12px}
.lcd{background:#c9c8b8;border-radius:14px;padding:10px;position:relative;overflow:hidden}
.lcd:after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.25),transparent 45%);pointer-events:none}
.bar{font-family:'JetBrains Mono';font-size:13px;color:#333;border-bottom:1.5px solid #555;padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.c{aspect-ratio:1;border-radius:6px;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:30px}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin-top:22px}
.pad button{border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#444,#111);color:#eee;font-size:20px;cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,.3)}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.right{text-align:right}.serif{font-size:80px;line-height:100px;height:100px}.roll{height:100px;overflow:hidden}#words{transition:transform .6s cubic-bezier(.7,0,.3,1)}
.dock{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:20px;background:#fff;padding:12px 22px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.08);font-size:12px;text-align:center}
.dock div div{font-size:28px}

<nav class="mono"><b>JOANNE YANG</b><div><span>LINKEDIN</span><span>EMAIL</span><span>RESUME</span></div></nav>
<div class="hero">
 <div class="left"><div class="mono">hello,</div><div class="big">I design for</div><div class="mono">product designer</div></div>
 <div class="console"><div class="screen"><div class="lcd"><div class="bar"><span>‹ Happy_2048</span><span id="sc">0</span></div><div id="grid"></div></div></div>
  <div class="pad"><span></span><button data-d="2">▲</button><span></span><button data-d="0">◀</button><span></span><button data-d="1">▶</button><span></span><button data-d="3">▼</button><span></span></div></div>
 <div class="right"><div class="roll"><div id="words"><p class="serif">emotions.</p><p class="serif">humans.</p><p class="serif">experiences.</p><p class="serif">efficiency.</p><p class="serif">emotions.</p></div></div><div class="mono">recently: master of hci @cmu</div></div>
</div>
<div class="dock"><div><div>📁</div>works</div><div><div>🎮</div>play</div><div><div>🙂</div>profile</div></div>
<script>
const E={2:'🙂',4:'😊',8:'😀',16:'😃',32:'😄',64:'😁',128:'😆',256:'😅',512:'😂',1024:'🤣',2048:'🥳',4096:'🤩'};
let b=Array(16).fill(0),s=0;const g=document.getElementById('grid');
function add(){const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
function draw(){g.innerHTML=b.map(v=>`<div class="c">${v?E[v]||'🤩':''}</div>`).join('');document.getElementById('sc').textContent=s}
function slide(r){r=r.filter(x=>x);for(let i=0;i<r.length-1;i++)if(r[i]==r[i+1]){r[i]*=2;s+=r[i];r.splice(i+1,1)}while(r.length<4)r.push(0);return r}
function move(d){const o=b.join();for(let k=0;k<4;k++){let idx=[0,1,2,3].map(j=>d<2?k*4+j:j*4+k);if(d%2)idx.reverse();const r=slide(idx.map(i=>b[i]));idx.forEach((i,j)=>b[i]=r[j])}if(b.join()!=o){add();draw()}}
document.onkeydown=e=>{const m={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(m!=null){e.preventDefault();move(m)}};
document.querySelectorAll('.pad button').forEach(x=>x.onclick=()=>move(+x.dataset.d));
add();add();add();add();draw();
const W=document.getElementById('words');let wi=0;
setInterval(()=>{wi++;W.style.transition='';W.style.transform=`translateY(${-wi*100}px)`;if(wi==4)setTimeout(()=>{W.style.transition='none';W.style.transform='translateY(0)';wi=0},650)},3000);
const cn=document.querySelector('.console');let x=0,y=0,sx,sy,on=false;
cn.addEventListener('pointerdown',e=>{if(e.target.tagName=='BUTTON')return;on=true;sx=e.clientX-x;sy=e.clientY-y;cn.classList.add('drag');cn.setPointerCapture(e.pointerId)});
cn.addEventListener('pointermove',e=>{if(!on)return;x=e.clientX-sx;y=e.clientY-sy;cn.style.setProperty('--x',x+'px');cn.style.setProperty('--y',y+'px')});
cn.addEventListener('pointerup',()=>{on=false;cn.classList.remove('drag')});
let lt=0;document.addEventListener('pointermove',e=>{const n=performance.now();if(n-lt<40)return;lt=n;
const p=document.createElement('div');p.className='sp';p.textContent=Math.random()<.5<.75?'✦':'✧';p.style.left=e.clientX-2+'px';p.style.top=e.clientY+'px';
p.style.setProperty('--dx',(Math.random()*16-8)+'px');p.style.color=['#ffc93c','#ffe27a','#a78bfa','#ff9ecb'][Math.random()*4|0];document.body.appendChild(p);setTimeout(()=>p.remove(),1100)});
</script></body></html>
